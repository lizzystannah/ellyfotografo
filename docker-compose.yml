version: '3.8'

services:
  elly-fotografo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elly_fotografo_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      # Guarda todas as galerias, definições da landing page, clientes e sessões na VPS
      - ./dados:/app/dados
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"var p=process.env.PORT||3000;require('http').get('http://127.0.0.1:'+p+'/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Se pretender correr MySQL localmente no Docker em vez de JSON ou serviço na cloud:
  #   - descomente o serviço "mysql" abaixo;
  #   - no .env use MYSQL_HOST="elly_fotografo_mysql" (o container_name) OU
  #     MYSQL_HOST="mysql" (o nome do serviço) — os dois ficam na mesma network;
  #   - se o MySQL estiver noutro projeto/stack, junte esse container à network
  #     deste projeto (ou crie uma network externa comum). O erro
  #     "getaddrinfo ENOTFOUND <nome>" indica que o nome não existe nessa rede.
  # Sem MySQL, a app continua a funcionar com os ficheiros em ./dados.
  # mysql:
  #   image: mysql:8.0
  #   container_name: elly_fotografo_mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root_password_super_secreta
  #     MYSQL_DATABASE: elly_fotografo
  #     MYSQL_USER: elly
  #     MYSQL_PASSWORD: elly_password_segura
  #   volumes:
  #     - ./dados/mysql:/var/lib/mysql
  #   ports:
  #     - "3306:3306"
